name: Release

# Push a tag like v0.2.0 to build the Windows installer, the portable .exe, the Android APK and the Chrome extension,
# and publish them as a GitHub release. The tag sets the version, so package.json's version doesn't need bumping by hand.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Set version from tag
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - run: npm test
      - run: npm run dist
      - run: npm run build:extension
      # Sign the APK with the same debug key as local builds (secret ANDROID_DEBUG_KEYSTORE = base64 of
      # ~/.android/debug.keystore), so a release installs over an earlier release or a local `npm run android:run`.
      # Without the secret Gradle makes a throwaway key, and updating needs an uninstall first.
      - name: Restore the Android signing key
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then mkdir -p ~/.android && echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore; fi
      - run: npm run android:apk
      - name: Copy the APK
        shell: bash
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "dist/TODO-$GITHUB_REF_NAME.apk"
      - name: Zip the Chrome extension
        shell: pwsh
        run: Compress-Archive -Path extension/dist/* -DestinationPath "dist/TODO-chrome-extension-$($env:GITHUB_REF_NAME).zip"
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.exe dist/*.apk dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
