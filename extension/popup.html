<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Add to TODO</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body class="popup">
    <form id="form">
      <div class="header">
        <svg class="logo" width="18" height="18" viewBox="0 0 64 64" aria-hidden="true"><path class="logo-line" d="M14 34 L27 47 L50 17" stroke-width="5" stroke-linejoin="round" /><circle class="logo-commit" cx="14" cy="34" r="5.5" stroke-width="4" /><circle class="logo-commit" cx="27" cy="47" r="5.5" stroke-width="4" /><circle class="logo-head" cx="50" cy="17" r="8" stroke-width="4" /></svg>
        <span class="header-title">Add to TODO</span>
        <button type="button" id="open-panel" class="icon-button" aria-label="Show tasks in the side panel">&#9776;</button>
        <button type="button" id="options-link" class="icon-button" aria-label="Settings">&#9881;</button>
      </div>

      <div id="setup" class="notice" hidden>
        Connect your tasks repo first.
        <button type="button" id="open-options" class="btn primary">Open settings</button>
      </div>

      <div id="fields">
        <label class="field">
          <span>Title</span>
          <input id="title" type="text" required autofocus />
        </label>
        <label class="field">
          <span>Notes</span>
          <textarea id="notes" rows="3"></textarea>
        </label>
        <div class="field">
          <span>Priority</span>
          <div id="priority" class="priority-picker"></div>
        </div>
        <div class="row">
          <label class="field grow">
            <span>List</span>
            <select id="list"></select>
          </label>
          <button type="button" id="star" class="star" aria-label="Important" aria-pressed="false">&#9734;</button>
        </div>
        <button id="add" type="submit" class="btn primary wide">Add</button>
      </div>
      <div id="status" class="status" role="status"></div>
    </form>
    <script type="module" src="./src/popup.ts"></script>
  </body>
</html>
